<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Rasmodium Loading</title>
    <style>
        /* --- ШРИФТЫ И БАЗА --- */
        @font-face {
            font-family: 'Bahnschrift';
            src: local('Bahnschrift'), local('Arial');
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgb(5, 3, 15);
            font-family: 'Bahnschrift', sans-serif;
            overflow: hidden;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ФОНОВЫЕ ЭФФЕКТЫ --- */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(155, 65, 220, 0.15) 0%, rgba(5, 3, 15, 1) 60%);
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            z-index: 2;
            pointer-events: none;
        }

        /* --- ЗВЕЗДЫ И ЧАСТИЦЫ --- */
        #particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        /* --- ЦЕНТРАЛЬНОЕ МЕНЮ --- */
        .content {
            z-index: 10;
            text-align: center;
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Логотип */
        h1 {
            font-size: 72px;
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(155, 65, 220, 0.5);
        }

        .text-accent { color: rgb(200, 120, 255); }
        .text-white { color: white; }

        /* Подзаголовок */
        h2 {
            font-size: 18px;
            font-weight: 300;
            color: rgb(140, 130, 170);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Линия разделитель */
        .divider {
            height: 2px;
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
            background: linear-gradient(90deg, transparent, rgb(155, 65, 220), transparent);
            position: relative;
        }
        
        .divider::after {
            content: '';
            position: absolute;
            top: -2px;
            left: 0;
            width: 10px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: lineRun 4s infinite linear;
            filter: blur(2px);
        }

        /* --- БЛОК ЗАГРУЗКИ В ЦЕНТРЕ --- */
        .loading-box {
            margin-top: 30px;
            padding: 15px 40px;
            background: rgba(80, 30, 140, 0.2);
            border: 1px solid rgba(155, 65, 220, 0.3);
            border-radius: 6px;
            min-width: 300px;
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(155, 65, 220, 0.1);
            transition: all 0.3s;
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: rgb(255, 255, 255);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- ПОЛОСКА ЗАГРУЗКИ В ПРАВОМ НИЖНЕМ УГЛУ --- */
        .bottom-progress {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 300px;
            z-index: 20;
            background: rgba(20, 10, 40, 0.7);
            border: 1px solid rgba(155, 65, 220, 0.4);
            border-radius: 8px;
            padding: 15px 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(155, 65, 220, 0.15);
            transition: all 0.3s;
        }

        .bottom-progress:hover {
            background: rgba(30, 15, 50, 0.8);
            box-shadow: 0 0 35px rgba(155, 65, 220, 0.25);
            transform: translateY(-2px);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-title {
            font-size: 14px;
            font-weight: 600;
            color: rgb(200, 120, 255);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-percent {
            font-size: 16px;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 10px rgba(200, 120, 255, 0.5);
        }

        .progress-bar-container {
            height: 6px;
            background: rgba(60, 20, 100, 0.5);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, 
                rgb(155, 65, 220) 0%, 
                rgb(200, 120, 255) 50%, 
                rgb(155, 65, 220) 100%);
            border-radius: 3px;
            position: relative;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 15px rgba(155, 65, 220, 0.7);
        }

        /* Блик на полоске */
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.3) 0%, 
                rgba(255, 255, 255, 0.1) 100%);
            border-radius: 3px 3px 0 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgb(140, 130, 170);
        }

        .progress-files {
            font-weight: 500;
        }

        .progress-speed {
            font-weight: 400;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes lineRun {
            0% { left: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* Анимация пульсации для полоски */
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(155, 65, 220, 0.7); }
            50% { box-shadow: 0 0 25px rgba(200, 120, 255, 0.9); }
            100% { box-shadow: 0 0 15px rgba(155, 65, 220, 0.7); }
        }

        .progress-bar-fill {
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="vignette"></div>
    <div id="particles-container"></div>

    <div class="content">
        <h1><span class="text-accent">Ras</span><span class="text-white">modium</span></h1>
        <h2 id="server-info">GARRYS MOD • LOADING...</h2>
        <div class="divider"></div>
        <div class="loading-box">
            <div class="status-text" id="status">Подключение к серверу...</div>
        </div>
    </div>

    <!-- НОВАЯ ПОЛОСКА ЗАГРУЗКИ В ПРАВОМ НИЖНЕМ УГЛУ -->
    <div class="bottom-progress">
        <div class="progress-header">
            <div class="progress-title">ЗАГРУЗКА СЕРВЕРА</div>
            <div class="progress-percent" id="percent">0%</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="bottom-progress-bar"></div>
        </div>
        <div class="progress-info">
            <div class="progress-files" id="file-count">Файлов: 0/0</div>
            <div class="progress-speed" id="speed">Скорость: 0 KB/s</div>
        </div>
    </div>

    <script>
        /* --- ГЕНЕРАЦИЯ ЧАСТИЦ --- */
        const container = document.getElementById('particles-container');
        const colors = ['rgb(155, 65, 220)', 'rgb(100, 200, 255)', 'rgb(255, 100, 180)'];

        // Создаем звезды
        for(let i=0; i<60; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            let size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            container.appendChild(star);
        }

        // Создаем плавающие частицы
        for(let i=0; i<40; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let color = colors[Math.floor(Math.random() * colors.length)];
            p.style.backgroundColor = color;
            p.style.boxShadow = `0 0 10px ${color}`;
            
            p.style.left = Math.random() * 100 + 'vw';
            let size = Math.random() * 4 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            
            p.style.animationDuration = (Math.random() * 10 + 10) + 's';
            p.style.animationDelay = (Math.random() * 20) * -1 + 's';
            
            container.appendChild(p);
        }

        /* --- ЛОГИКА GMOD --- */
        let filesTotal = 50;
        let filesDownloaded = 0;
        let startTime = Date.now();
        let lastUpdateTime = Date.now();
        let lastFilesCount = 0;

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById("server-info").innerText = (gamemode + " • " + mapname).toUpperCase();
        }

        function DownloadingFile(fileName) {
            filesDownloaded++;
            
            // Обновляем статус в центре
            document.getElementById("status").innerText = "Загрузка: " + fileName;
            
            // Обновляем полоску внизу
            let percent = Math.min((filesDownloaded / filesTotal) * 100, 100);
            document.getElementById("bottom-progress-bar").style.width = percent + "%";
            document.getElementById("percent").innerText = Math.round(percent) + "%";
            
            // Обновляем счетчик файлов
            document.getElementById("file-count").innerText = `Файлов: ${filesDownloaded}/${filesTotal}`;
            
            // Расчет скорости
            let currentTime = Date.now();
            let timeDiff = (currentTime - lastUpdateTime) / 1000; // в секундах
            let filesDiff = filesDownloaded - lastFilesCount;
            
            if(timeDiff >= 1) { // Обновляем скорость раз в секунду
                let speed = Math.round((filesDiff * 100) / timeDiff); // Примерная скорость в KB/s
                document.getElementById("speed").innerText = `Скорость: ${speed} KB/s`;
                
                lastUpdateTime = currentTime;
                lastFilesCount = filesDownloaded;
            }
            
            // Если файлов больше, увеличиваем лимит
            if(filesDownloaded > filesTotal) filesTotal += 10;
        }

        function SetStatusChanged(status) {
            document.getElementById("status").innerText = status;
            
            // Если статус Sending Client Info - значит почти всё
            if(status.indexOf("Sending Client Info") >= 0) {
                document.getElementById("bottom-progress-bar").style.width = "100%";
                document.getElementById("percent").innerText = "100%";
                document.getElementById("speed").innerText = "Готово!";
            }
        }
    </script>
</body>
</html>

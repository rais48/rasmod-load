<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasmodium — Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #03060A;
    color: #B2B5B8;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* --- Фон: мягкое свечение + затемнение слева, как в меню --- */
  .glow {
    position: fixed;
    width: 70vmax; height: 70vmax;
    right: -20vmax; top: 50%;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(110,70,255,0.10) 0%, rgba(110,70,255,0.03) 40%, transparent 70%);
    pointer-events: none;
  }
  .shade {
    position: fixed; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.18) 55%, rgba(0,0,0,0.05) 100%);
    pointer-events: none;
  }

  /* --- Кольца Aperture на фоне --- */
  .rings {
    position: fixed;
    right: -16vw; top: 50%;
    transform: translateY(-50%);
    width: 58vw; height: 58vw;
    pointer-events: none;
  }
  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.05);
  }
  .ring.r2 { inset: 13%; border-color: rgba(110,70,255,0.14); animation: spin 90s linear infinite; }
  .ring.r3 { inset: 27%; border-color: rgba(255,255,255,0.04); animation: spin 60s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Шапка: бренд + сплэш + инфо о сервере --- */
  header {
    position: fixed;
    left: 10.5%; top: 7%;
    z-index: 2;
  }
  h1 {
    font-size: clamp(52px, 8.5vw, 104px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #F5F6F7;
  }
  h1 .accent { color: #6E46FF; }

  #splash {
    margin-top: 10px;
    font-size: clamp(11px, 1.3vw, 15px);
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8B949E;
  }

  .server { margin-top: 34px; }
  #serverName {
    font-size: clamp(16px, 1.8vw, 21px);
    font-weight: 700;
    color: #F5F6F7;
  }
  #serverMeta {
    margin-top: 5px;
    font-size: clamp(10px, 1.1vw, 13px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8B949E;
  }
  #serverUrl {
    margin-top: 5px;
    font-size: 12px;
    color: #6E46FF;
    display: none;
  }

  /* --- Нижний блок: совет, статус, прогресс --- */
  .bottom {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 0 10.5% 30px;
    z-index: 2;
  }
  #tip {
    font-size: clamp(11px, 1.2vw, 14px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8B949E;
    margin-bottom: 10px;
    transition: opacity 0.5s ease;
  }
  #tip b { color: #6E46FF; font-weight: 700; }
  #status {
    font-size: clamp(14px, 1.6vw, 18px);
    font-weight: 500;
    color: #F5F6F7;
    margin-bottom: 12px;
  }
  .bar {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  #fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6E46FF, #9B7BFF);
    border-radius: 3px;
    transition: width 0.3s ease;
    position: relative;
  }
  #fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: shimmer 1.8s linear infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }
  .bar-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #8B949E;
  }
  #pct { color: #F5F6F7; font-weight: 700; }

  /* --- Кнопка музыки --- */
  #muteBtn {
    position: fixed;
    top: 22px; right: 24px;
    z-index: 3;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    color: #B2B5B8;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 9px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  #muteBtn:hover { color: #F5F6F7; border-color: rgba(110,70,255,0.6); }
</style>
</head>
<body>

  <div class="glow"></div>
  <div class="rings">
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
  </div>
  <div class="shade"></div>

  <header>
    <h1><span class="accent">Ras</span>modium</h1>
    <div id="splash"></div>
    <div class="server">
      <div id="serverName">Rasmodium</div>
      <div id="serverMeta">Connecting...</div>
      <div id="serverUrl"></div>
    </div>
  </header>

  <div class="bottom">
    <div id="tip"></div>
    <div id="status">Connecting to server...</div>
    <div class="bar"><div id="fill"></div></div>
    <div class="bar-meta">
      <span id="files"></span>
      <span id="pct">0%</span>
    </div>
  </div>

  <button id="muteBtn">&#9834; MUSIC: ON</button>

  <!--
    МУЗЫКА НА ФОНЕ:
    Файл music.mp3 лежит рядом с этим index.html — больше ничего делать не нужно.
    Скрипт ниже сам перебирает список TRACKS (music.mp3, music/GTA_V.mp3, music.ogg ...)
    и включает первый найденный. Переименовал трек — допиши имя в начало TRACKS.
    Громкость: VOLUME = 0.4 (0.0 — 1.0).
  -->
  <audio id="bgm" loop preload="auto" playsinline autoplay></audio>

<script>
  // ---------- Случайный сплэш (тот же список, что в меню) ----------
  var splashes = [
    "HELL IS NEAR",
    "I WISH YOU GOOD HEALTH, JASON STATHAM"
  ];
  document.getElementById('splash').textContent =
    splashes[Math.floor(Math.random() * splashes.length)];

  // ---------- Сменяющиеся советы ----------
  var tips = [
    "THE CAKE IS A LIE",
    "PRESS M TO MUTE THE MUSIC",
    "CHECK THE DISCORD FOR UPDATES",
    "THE TRAITOR WAS KILLED",
    "HOP ON RASMODIUM",
    "STAY HYDRATED, JASON STATHAM",
    "ALSO TRY MODDED HOMICIDE 2"
  ];
  var tipEl = document.getElementById('tip');
  var tipIndex = 0;
  function showTip() {
    tipEl.style.opacity = 0;
    setTimeout(function () {
      tipEl.innerHTML = "<b>TIP:</b> " + tips[tipIndex];
      tipEl.style.opacity = 1;
      tipIndex = (tipIndex + 1) % tips.length;
    }, 500);
  }
  showTip();
  setInterval(showTip, 6000);

  // ---------- Garry's Mod Loading API ----------
  var fillEl    = document.getElementById('fill');
  var pctEl     = document.getElementById('pct');
  var filesEl   = document.getElementById('files');
  var statusEl  = document.getElementById('status');
  var nameEl    = document.getElementById('serverName');
  var metaEl    = document.getElementById('serverMeta');
  var urlEl     = document.getElementById('serverUrl');

  var filesTotal = 0, filesNeeded = 0;
  var mapName = "", gamemodeName = "";
  var apiCalled = false;

  function markApi() { apiCalled = true; }

  function updateMeta() {
    var parts = [];
    if (mapName) parts.push(mapName);
    if (gamemodeName) parts.push(gamemodeName);
    metaEl.textContent = parts.length ? parts.join("  •  ") : "Connecting...";
  }

  function updateProgress() {
    var p = 0;
    if (filesTotal > 0) {
      p = Math.round((filesTotal - filesNeeded) / filesTotal * 100);
      filesEl.textContent = "FILES: " + (filesTotal - filesNeeded) + " / " + filesTotal;
    } else {
      filesEl.textContent = "";
    }
    fillEl.style.width = p + "%";
    pctEl.textContent = p + "%";
  }

  window.SetStatusChanged = function (status) {
    markApi();
    statusEl.textContent = status;
  };
  window.SetFilesTotal = function (total) {
    markApi();
    filesTotal = total;
    updateProgress();
  };
  window.SetFilesNeeded = function (needed) {
    markApi();
    filesNeeded = needed;
    updateProgress();
  };
  window.SetServerName = function (name) {
    markApi();
    nameEl.textContent = name;
  };
  window.SetServerURL = function (url) {
    markApi();
    urlEl.textContent = url;
    urlEl.style.display = url ? "block" : "none";
  };
  window.SetMapName = function (map) {
    markApi();
    mapName = map;
    updateMeta();
  };
  window.SetGamemodeName = function (gm) {
    markApi();
    gamemodeName = gm;
    updateMeta();
  };

  // ---------- Демо-прогресс для проверки в обычном браузере ----------
  // В игре GMod сразу вызывает API выше, поэтому демо не запустится.
  setTimeout(function () {
    if (apiCalled) return;
    var p = 0;
    var iv = setInterval(function () {
      p += Math.random() * 4;
      if (p >= 100) { p = 100; clearInterval(iv); }
      fillEl.style.width = p + "%";
      pctEl.textContent = Math.floor(p) + "%";
    }, 120);
  }, 4000);

  // ---------- Фоновая музыка ----------
  (function () {
    var bgm = document.getElementById('bgm');
    var muteBtn = document.getElementById('muteBtn');

    var VOLUME = 0.4;                // громкость: 0.0 — 1.0
    var TRACKS = [                   // порядок поиска файла — первый найденный играет
      'music.mp3',
      'music/music.mp3',
      'music/GTA_V.mp3',
      'music.ogg',
      'music/GTA_V.ogg'
    ];

    var track = 0;
    var mutedByUser = false;
    var started = false;             // трек реально заиграл хотя бы раз
    var unlockBound = false;

    bgm.volume = VOLUME;
    bgm.loop = true;

    function setLabel(html, disabled) {
      muteBtn.innerHTML = html;
      muteBtn.disabled = !!disabled;
      muteBtn.style.opacity = disabled ? '0.45' : '';
      muteBtn.style.cursor = disabled ? 'default' : 'pointer';
    }

    function refreshLabel() {
      if (!started && bgm.paused) {
        setLabel('&#9834; MUSIC: TAP TO START');
      } else {
        setLabel(bgm.muted || mutedByUser ? '&#9834; MUSIC: OFF' : '&#9834; MUSIC: ON');
      }
    }

    function play() {
      if (mutedByUser || !bgm.src) return;
      bgm.muted = false;
      var p = bgm.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {
          started = true;
          refreshLabel();
        })['catch'](function () {
          // Браузер ждёт взаимодействия со страницей — включим по первому клику/клавише.
          bindUnlock();
          refreshLabel();
        });
      } else {
        // Старые движки (например, встроенный браузер GMod) не возвращают Promise.
        setTimeout(function () {
          if (!bgm.paused) { started = true; refreshLabel(); }
          else bindUnlock();
        }, 300);
      }
    }

    // Снимаем блокировку автоплея по первому жесту пользователя.
    function bindUnlock() {
      if (unlockBound) return;
      unlockBound = true;
      var evs = ['pointerdown', 'mousedown', 'touchstart', 'keydown', 'click'];
      function onFirst() {
        for (var i = 0; i < evs.length; i++) {
          document.removeEventListener(evs[i], onFirst, true);
        }
        unlockBound = false;
        play();
      }
      for (var i = 0; i < evs.length; i++) {
        document.addEventListener(evs[i], onFirst, true);
      }
    }

    function loadTrack() {
      if (track >= TRACKS.length) {
        setLabel('&#9834; NO MUSIC FILE', true);
        if (window.console && console.warn) {
          console.warn('[Rasmodium] Аудиофайл не найден. Положи music.mp3 рядом с index.html. Искал: ' +
                       TRACKS.join(', '));
        }
        return;
      }
      bgm.src = TRACKS[track];
      try { bgm.load(); } catch (e) {}
      play();
    }

    bgm.addEventListener('error', function () {
      track++;
      loadTrack();
    });
    var readyEvents = ['canplay', 'canplaythrough', 'loadeddata'];
    for (var r = 0; r < readyEvents.length; r++) {
      bgm.addEventListener(readyEvents[r], play);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) play();
    });
    window.addEventListener('focus', play);

    loadTrack();

    // Повторные попытки: некоторые браузеры разрешают звук чуть позже загрузки страницы.
    var retries = [0, 250, 1000, 2500, 5000];
    for (var t = 0; t < retries.length; t++) {
      setTimeout(play, retries[t]);
    }
    setInterval(function () {
      if (!started && bgm.paused) play();
    }, 4000);

    // Кнопка и клавиша M: включить / выключить звук.
    function toggle() {
      if (bgm.paused) {          // музыка ещё не звучит — этот клик и есть жест пользователя
        mutedByUser = false;
        bgm.muted = false;
        play();
        return;
      }
      mutedByUser = !mutedByUser;
      bgm.muted = mutedByUser;
      refreshLabel();
    }

    muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggle();
    });
    document.addEventListener('keydown', function (e) {
      var k = e.key;
      if (k === 'm' || k === 'M' || k === 'ь' || k === 'Ь' || e.keyCode === 77) toggle();
    });

    refreshLabel();
  })();
</script>
</body>
</html>
